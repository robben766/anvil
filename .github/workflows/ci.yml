name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: anvil
          POSTGRES_PASSWORD: anvil
          POSTGRES_DB: anvil
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U anvil"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANVIL_DATABASE_URL: postgresql+asyncpg://anvil:anvil@localhost:5434/anvil
      ANVIL_TEST_DATABASE_URL: postgresql+asyncpg://anvil:anvil@localhost:5434/anvil
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-zh-v1.5
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: cd packages/core/gateway && uv run alembic upgrade head
      - run: cd packages/kb && uv run alembic upgrade head
      - run: uv run pytest -m "not live" -q
