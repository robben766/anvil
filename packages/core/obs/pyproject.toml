[project]
name = "anvil-obs"
version = "0.1.0"
description = "anvil P0: self-built OTEL span model and OTLP exporter"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-proto>=1.25",
    "httpx>=0.27",
    "protobuf>=4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anvil_obs"]
