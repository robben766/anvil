[project]
name = "anvil-eval"
version = "0.1.0"
description = "anvil P0: hand-rolled RAGAS metrics with golden-set runner"
requires-python = ">=3.12"
dependencies = [
    "anvil-gateway",
    "fastembed>=0.3",
    "numpy>=1.26",
]

[tool.uv.sources]
anvil-gateway = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
anvil-eval = "anvil_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anvil_eval"]
