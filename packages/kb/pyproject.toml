[project]
name = "anvil-kb"
version = "0.1.0"
description = "anvil knowledge base: hand-rolled RAG pipeline"
requires-python = ">=3.12"
dependencies = [
    "anvil-gateway",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "fastembed>=0.3",
]

[tool.uv.sources]
anvil-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anvil_kb"]
