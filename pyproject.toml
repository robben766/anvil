[tool.uv.workspace]
members = ["packages/core/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: real API calls; run manually with -m live"]

[tool.ruff.lint.isort]
known-first-party = ["anvil_gateway"]
